nodeLinker: hoisted

allowBuilds:
  '@sentry/cli': true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  unrs-resolver: true

overrides:
  'esbuild': '^0.28.0'
  'nan': '^2.25.0'
  'basic-ftp': '^5.2.0'
  'tar': '^7.5.21'
  'dompurify': '^3.4.13'

  # external-editor pulls tmp@0.0.33, which has an unpatched path traversal
  # (GHSA-ph9p-34f9-6g65). Only 0.2.6+ is fixed, so the transitive copy has to be
  # forced up to match the 0.2.x that tmp-promise already resolves to.
  'tmp': '^0.2.6'

  # react-use pulls js-cookie@2.2.1, which has a prototype hijack in assign()
  # (GHSA-qjx8-664m-686j) fixed only in 3.x.
  'js-cookie': '^3.0.7'

  # Electron Forge uses an old version of @electron/rebuild which has a github dependency on
  # the now deprecated @electron/node-gyp. Until Electron Forge updates the dependency (which
  # will probably not happen until 8.0.0) we need to have override this.
  '@electron/node-gyp': 'npm:node-gyp@12.3.0'

patchedDependencies:
  rrweb: patches/rrweb.patch
